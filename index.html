<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para ti 🌻</title>

<style>

/* =========================
   CONFIGURACIÓN GENERAL
========================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    overflow:hidden;
    font-family:Georgia,serif;
    background:#111;
}


/* =========================
   PANTALLA INICIAL
========================= */

#inicio{
    position:fixed;
    inset:0;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:10;

    transition:1s;
}

#inicio.oculto{
    opacity:0;
    pointer-events:none;
}

.boton-inicio{
    padding:16px 32px;

    border:none;
    border-radius:30px;

    background:#ffd43b;
    color:#3b2b00;

    font-size:20px;
    font-family:Georgia,serif;

    cursor:pointer;

    box-shadow:0 0 20px rgba(255,210,50,.5);

    transition:.3s;
}

.boton-inicio:hover{
    transform:scale(1.08);
}


/* =========================
   ESCENA
========================= */

#escena{
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at center,#2b2108,#111 65%);

    opacity:0;

    transition:1.5s;
}

#escena.mostrar{
    opacity:1;
}


/* =========================
   TEXTO
========================= */

.titulo{
    color:#f8d65b;

    font-size:30px;

    text-align:center;

    margin-bottom:25px;

    opacity:0;
    transform:translateY(20px);

    animation:aparecer 1.5s 1s forwards;
}


/* =========================
   RAMO
========================= */

.ramo{
    position:relative;

    width:330px;
    height:360px;

    margin-bottom:20px;
}


/* TALLOS */

.tallo{
    position:absolute;

    width:7px;
    height:220px;

    background:linear-gradient(
        to right,
        #284b20,
        #477b2e,
        #1e3c18
    );

    border-radius:10px;

    bottom:15px;
    left:50%;

    transform-origin:bottom;
}

.tallo1{
    transform:rotate(-20deg);
}

.tallo2{
    transform:rotate(-10deg);
}

.tallo3{
    transform:rotate(0deg);
}

.tallo4{
    transform:rotate(10deg);
}

.tallo5{
    transform:rotate(20deg);
}


/* =========================
   HOJAS
========================= */

.hoja{
    position:absolute;

    width:55px;
    height:25px;

    background:#3f7028;

    border-radius:100% 0 100% 0;

    bottom:80px;
}

.hoja1{
    left:70px;
    transform:rotate(25deg);
}

.hoja2{
    right:70px;
    transform:scaleX(-1) rotate(25deg);
}

.hoja3{
    left:120px;
    bottom:125px;
    transform:rotate(-20deg);
}


/* =========================
   FLORES
========================= */

.flor{
    position:absolute;

    width:105px;
    height:105px;

    animation:florAparece 1.2s forwards;

    opacity:0;
}


/* POSICIONES */

.flor1{
    left:15px;
    top:65px;
    animation-delay:.4s;
}

.flor2{
    left:80px;
    top:20px;
    animation-delay:.7s;
}

.flor3{
    left:145px;
    top:70px;
    animation-delay:1s;
}

.flor4{
    left:210px;
    top:25px;
    animation-delay:1.3s;
}

.flor5{
    left:110px;
    top:120px;
    animation-delay:1.6s;
}


/* PÉTALOS */

.petalo{
    position:absolute;

    width:35px;
    height:55px;

    background:linear-gradient(
        #ffd83d,
        #e8a900
    );

    border-radius:50%;

    left:35px;
    top:0;

    transform-origin:18px 53px;
}


/* ROTACIONES */

.petalo:nth-child(1){
    transform:rotate(0deg);
}

.petalo:nth-child(2){
    transform:rotate(45deg);
}

.petalo:nth-child(3){
    transform:rotate(90deg);
}

.petalo:nth-child(4){
    transform:rotate(135deg);
}

.petalo:nth-child(5){
    transform:rotate(180deg);
}

.petalo:nth-child(6){
    transform:rotate(225deg);
}

.petalo:nth-child(7){
    transform:rotate(270deg);
}

.petalo:nth-child(8){
    transform:rotate(315deg);
}


/* CENTRO */

.centro{
    position:absolute;

    width:43px;
    height:43px;

    background:
    radial-gradient(
        circle,
        #2b1600 15%,
        #5b2f00 50%,
        #321900
    );

    border-radius:50%;

    left:31px;
    top:31px;

    box-shadow:
    inset 0 0 8px #130900,
    0 0 4px #000;
}


/* =========================
   BOTÓN CARTA
========================= */

#abrir{
    padding:13px 30px;

    background:transparent;

    border:1px solid #e6c74e;

    color:#f4d85a;

    border-radius:30px;

    font-size:17px;

    cursor:pointer;

    opacity:0;

    animation:aparecer 1s 2.4s forwards;

    transition:.3s;
}

#abrir:hover{
    background:#f4d85a;
    color:#241900;
}


/* =========================
   CARTA
========================= */

#carta{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.82);

    display:flex;

    justify-content:center;
    align-items:center;

    opacity:0;

    pointer-events:none;

    transition:.7s;

    z-index:20;
}

#carta.abierta{
    opacity:1;

    pointer-events:auto;
}


/* PAPEL */

.papel{
    position:relative;

    width:330px;

    padding:25px;

    background:#fff8e8;

    color:#493c2d;

    border-radius:5px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.5);

    transform:scale(.5) rotate(-4deg);

    transition:.7s;

    text-align:center;
}

#carta.abierta .papel{
    transform:scale(1) rotate(0);
}


/* FOTO DECORATIVA */

.foto{
    width:100%;
    height:170px;

    background:
    linear-gradient(
        135deg,
        #f7d55c,
        #fff0a5
    );

    display:flex;

    justify-content:center;
    align-items:center;

    margin-bottom:20px;

    border:8px solid white;

    box-shadow:0 2px 8px #aaa;
}


/* RAMITO PEQUEÑO */

.foto .mini-ramo{
    transform:scale(.55);
}


/* TEXTO */

.papel h2{
    font-size:26px;

    color:#b8860b;

    font-style:italic;
}

.papel p{
    line-height:1.7;

    font-size:16px;
}


/* CERRAR */

.cerrar{
    position:absolute;

    top:15px;
    right:15px;

    width:32px;
    height:32px;

    border:none;

    border-radius:50%;

    background:#d8b43c;

    color:white;

    cursor:pointer;

    font-size:18px;
}


/* =========================
   ANIMACIONES
========================= */

@keyframes aparecer{

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes florAparece{

    from{
        opacity:0;
        transform:scale(0) rotate(-30deg);
    }

    to{
        opacity:1;
        transform:scale(1) rotate(0);
    }

}

</style>
</head>


<body>


<!-- =========================
     PRIMERA PANTALLA
========================= -->

<div id="inicio">

    <button
        class="boton-inicio"
        onclick="comenzar()">

        Dale click :)

    </button>

</div>



<!-- =========================
     ESCENA
========================= -->

<div id="escena">

    <div class="titulo">
        Para alguien especial...
    </div>


    <div class="ramo">

        <!-- TALLOS -->

        <div class="tallo tallo1"></div>
        <div class="tallo tallo2"></div>
        <div class="tallo tallo3"></div>
        <div class="tallo tallo4"></div>
        <div class="tallo tallo5"></div>


        <!-- HOJAS -->

        <div class="hoja hoja1"></div>
        <div class="hoja hoja2"></div>
        <div class="hoja hoja3"></div>


        <!-- FLORES -->

        <div class="flor flor1">
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="centro"></div>
        </div>


        <div class="flor flor2">
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="centro"></div>
        </div>


        <div class="flor flor3">
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="centro"></div>
        </div>


        <div class="flor flor4">
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="centro"></div>
        </div>


        <div class="flor flor5">
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="centro"></div>
        </div>

    </div>


    <button id="abrir" onclick="abrirCarta()">
        Ábreme
    </button>

</div>



<!-- =========================
     CARTA
========================= -->

<div id="carta">

    <div class="papel">

        <button
            class="cerrar"
            onclick="cerrarCarta()">

            ×

        </button>


        <div class="foto">

            <div class="ramo mini-ramo">

                <div class="tallo tallo1"></div>
                <div class="tallo tallo2"></div>
                <div class="tallo tallo3"></div>

                <div class="flor flor2">
                    <div class="petalo"></div>
                    <div class="petalo"></div>
                    <div class="petalo"></div>
                    <div class="petalo"></div>
                    <div class="petalo"></div>
                    <div class="petalo"></div>
                    <div class="petalo"></div>
                    <div class="petalo"></div>
                    <div class="centro"></div>
                </div>

            </div>

        </div>


        <h2>
            Mi lugar favorito
        </h2>


        <p>
            Hay lugares bonitos en el mundo,
            pero mi favorito siempre será
            aquel en el que pueda compartir
            un momento contigo.
        </p>


        <p>
            🌻
        </p>

    </div>

</div>



<script>

function comenzar(){

    document
    .getElementById("inicio")
    .classList.add("oculto");


    setTimeout(function(){

        document
        .getElementById("escena")
        .classList.add("mostrar");

    },500);

}


function abrirCarta(){

    document
    .getElementById("carta")
    .classList.add("abierta");

}


function cerrarCarta(){

    document
    .getElementById("carta")
    .classList.remove("abierta");

}

</script>


</body>
</html>
